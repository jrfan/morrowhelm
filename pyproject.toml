[project]
name = "morrowhelm"
version = "0.1.0"
description = "A local-first mobile command deck for one-person companies."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography>=44.0.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[project.scripts]
morrowhelm = "morrowhelm.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morrowhelm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
