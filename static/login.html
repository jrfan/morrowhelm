<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11111a" />
    <meta name="description" content="Sign in to your local MorrowHelm founder cockpit." />
    <title>Sign in · MorrowHelm</title>
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="brand-mark"><img src="/static/icon-192.png" alt="MorrowHelm" /></div>
      <p class="eyebrow">LOCAL-FIRST FOUNDER COCKPIT</p>
      <h1>Welcome to MorrowHelm</h1>
      <p class="muted">Sign in to steer your virtual company from anywhere.</p>
      <form id="login-form">
        <label for="password">Local access password</label>
        <div class="password-field"><input id="password" type="password" autocomplete="current-password" required autofocus placeholder="Enter your password" /><button id="password-toggle" class="icon-button" type="button" aria-label="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg></button></div>
        <button id="login-button" class="primary-button" type="submit">Enter the helm</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
      <p class="login-footnote"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V7Z" /><path d="m8.5 12 2.2 2.2 4.8-5" /></svg><span>Your password unlocks this local instance. Secrets stay on the MorrowHelm host.</span></p>
    </main>
    <script>
      const form = document.querySelector('#login-form');
      const error = document.querySelector('#login-error');
      const password = document.querySelector('#password');
      const toggle = document.querySelector('#password-toggle');
      const submit = document.querySelector('#login-button');
      toggle.addEventListener('click', () => {
        const visible = password.type === 'text';
        password.type = visible ? 'password' : 'text';
        toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
        password.focus();
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        submit.disabled = true;
        submit.textContent = 'Opening your cockpit…';
        try {
          const response = await fetch('/api/session', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: password.value})});
          if (!response.ok) { error.textContent = 'That password did not work.'; password.focus(); return; }
          window.location.href = '/';
        } catch (_) {
          error.textContent = 'MorrowHelm could not reach the local host.';
        } finally {
          submit.disabled = false;
          submit.textContent = 'Enter the helm';
        }
      });
    </script>
  </body>
</html>
