<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11111a" />
    <meta name="description" content="A local-first mobile command deck for one-person companies." />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icon-192.png" />
    <link rel="stylesheet" href="/static/styles.css" />
    <title>MorrowHelm</title>
  </head>
  <body>
    <a class="skip-link" href="#view-root">Skip to company cockpit</a>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <div class="app-frame">
      <header class="topbar">
        <div>
          <p class="eyebrow">FOUNDER COCKPIT · LOCAL-FIRST</p>
          <h1 id="company-name">MorrowHelm</h1>
        </div>
        <button id="settings-button" class="icon-button" aria-label="Open connections and settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M14 5v4M4 17h2M10 17h10M6 15v4M4 12h5M13 12h7M9 10v4" /></svg>
        </button>
      </header>
      <main id="view-root" class="view-root" tabindex="-1">
        <div class="loading-state" role="status"><span class="loading-orbit" aria-hidden="true"></span><p>Preparing your company cockpit…</p></div>
      </main>
      <nav class="bottom-nav" aria-label="Primary navigation">
        <button data-view="home" class="nav-item active" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8" /><path d="M5 10v10h14V10M9 20v-6h6v6" /></svg></span><small>Home</small></button>
        <button data-view="chat" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z" /></svg></span><small>Chat</small></button>
        <button data-view="tasks" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" /><path d="m4 6 .8.8L6.5 5M4 12l.8.8 1.7-1.8M4 18l.8.8 1.7-1.8" /></svg></span><small>Tasks</small></button>
        <button data-view="approvals" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V7Z" /><path d="m8.5 12 2.2 2.2 4.8-5" /></svg></span><small>Approvals</small><b id="approval-badge" class="nav-badge">0</b></button>
        <button data-view="people" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg></span><small>People</small></button>
      </nav>
    </div>
    <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title"></dialog>
    <script src="/static/app.js" defer></script>
  </body>
</html>
